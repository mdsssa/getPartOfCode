<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подземелье</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0B14;
    --stone: #1E1B2E;
    --stone-light: #2A2640;
    --torch: #F2A65A;
    --hero: #3F9E5C;
    --hero-dark: #2C7A44;
    --hero-bright: #5CC17E;
    --slime: #5FC26E;
    --slime-dark: #3D8F49;
    --boss: #7A4FBE;
    --boss-dark: #4E2E7E;
    --heart: #E8546B;
    --gold: #E8C547;
    --death: #C4293A;
    --ink: #E9E6F2;
    --ink-dim: #8B87A3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 14px 50px;
  }

  .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--torch);
    margin: 0 0 12px;
    text-align: center;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    line-height: 1.6;
    text-align: center;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .sub {
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 0 22px;
  }

  .sub b { color: var(--ink); }

  .game-wrap {
    position: relative;
    width: 480px;
    max-width: 100%;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--stone);
    border: 4px solid var(--stone-light);
    border-radius: 3px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
  }

  .hearts { display: flex; gap: 5px; }

  .heart-icon {
    width: 16px;
    height: 16px;
    background: var(--heart);
    clip-path: polygon(50% 15%, 61% 4%, 76% 4%, 89% 17%, 89% 33%, 50% 78%, 11% 33%, 11% 17%, 24% 4%, 39% 4%);
    transition: opacity 150ms ease;
  }

  .heart-icon.empty { background: #3A3550; }

  .room-label {
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }

  .boss-bar-wrap {
    width: 100%;
    height: 10px;
    background: #1E1B2E;
    border: 2px solid var(--stone-light);
    border-radius: 3px;
    margin-bottom: 8px;
    display: none;
    overflow: hidden;
  }

  .boss-bar-wrap.show { display: block; }

  .boss-bar {
    height: 100%;
    background: var(--boss);
    width: 100%;
    transition: width 200ms ease;
  }

  .overlay {
    position: absolute;
    inset: 4px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13,11,20,0.88);
    border-radius: 3px;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }

  .overlay.show { display: flex; }

  .overlay-inner { max-width: 340px; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--gold);
    margin: 0 0 14px;
    line-height: 1.6;
  }

  .key-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 16px;
    position: relative;
    transform: scale(0);
  }

  .key-icon.pop {
    animation: key-pop 420ms cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes key-pop {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .key-icon svg { width: 100%; height: 100%; }

  .final-code {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 18px;
  }

  .overlay-sub {
    color: var(--ink-dim);
    font-size: 13.5px;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    border: none;
    padding: 12px 18px;
    background: var(--gold);
    color: #1A1520;
    transition: transform 100ms ease, filter 150ms ease;
  }

  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--torch); outline-offset: 3px; }

  /* --- Death overlay --- */
  .death-overlay {
    position: absolute;
    inset: 4px;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0A0508;
    border-radius: 3px;
    text-align: center;
    z-index: 6;
    opacity: 0;
  }

  .death-overlay.show {
    display: flex;
    animation: death-fade-in 500ms ease forwards;
  }

  .death-overlay.hide {
    animation: death-fade-out 500ms ease forwards;
  }

  @keyframes death-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes death-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  .death-face {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 22px;
  }

  .death-eye {
    width: 22px;
    height: 22px;
    position: relative;
  }

  .death-eye::before, .death-eye::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 4px;
    background: var(--death);
    top: 50%;
    left: 0;
  }

  .death-eye::before { transform: translateY(-50%) rotate(45deg); }
  .death-eye::after { transform: translateY(-50%) rotate(-45deg); }

  .death-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: var(--death);
    letter-spacing: 0.08em;
    margin: 0 0 14px;
  }

  .death-sub {
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .flash {
    position: absolute;
    inset: 4px;
    background: rgba(232,84,107,0.35);
    border-radius: 3px;
    opacity: 0;
    pointer-events: none;
  }

  .flash.show {
    animation: flash-fade 350ms ease;
  }

  @keyframes flash-fade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* --- Touch controls --- */
  .touch-controls {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 480px;
    max-width: 100%;
    margin-top: 18px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }

  .dpad button {
    background: var(--stone-light);
    color: var(--ink);
    font-size: 14px;
    padding: 0;
    width: 44px;
    height: 44px;
  }

  .dpad button:active { background: var(--hero-dark); }

  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 3; }

  .btn-attack {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--heart);
    color: #1A1520;
    font-size: 10px;
  }

  @media (min-width: 720px) {
    .touch-controls { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .key-icon.pop, .flash.show, .death-overlay.show, .death-overlay.hide { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<p class="eyebrow">Подземелье</p>
<h1></h1>
<p class="sub"><b>WASD</b> — движение, <b>Пробел</b> — атака .Погибнешь — начнёшь путь заново от входа.</p>

<div class="game-wrap">
  <div class="hud">
    <div class="hearts" id="hearts"></div>
    <div class="room-label" id="roomLabel">ВХОД</div>
  </div>
  <div class="boss-bar-wrap" id="bossBarWrap">
    <div class="boss-bar" id="bossBar"></div>
  </div>
  <canvas id="gameCanvas" width="480" height="360"></canvas>
  <div class="flash" id="flash"></div>

  <div class="death-overlay" id="deathOverlay">
    <div>
      <div class="death-face">
        <div class="death-eye"></div>
        <div class="death-eye"></div>
      </div>
      <p class="death-title">Вы погибли!</p>
      <p class="death-sub">Путь начинается заново...</p>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-inner">
      <p class="overlay-title">Сундук открыт</p>
      <div class="key-icon" id="keyIcon">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="13" cy="13" r="9" fill="#E8C547" stroke="#1A1520" stroke-width="2"/>
          <circle cx="13" cy="13" r="3.5" fill="#1A1520"/>
          <rect x="19" y="11" width="18" height="4" fill="#E8C547" stroke="#1A1520" stroke-width="1.5"/>
          <rect x="29" y="15" width="4" height="6" fill="#E8C547" stroke="#1A1520" stroke-width="1.5"/>
          <rect x="34" y="15" width="4" height="8" fill="#E8C547" stroke="#1A1520" stroke-width="1.5"/>
        </svg>
      </div>
      <p class="final-code" id="finalCode">FFWGTE</p>
      <p class="overlay-sub"></p>
      <button id="copyBtn">Скопировать код</button>
    </div>
  </div>
</div>

<div class="touch-controls">
  <div class="dpad">
    <button class="dpad-up" data-key="w">▲</button>
    <button class="dpad-left" data-key="a">◀</button>
    <button class="dpad-right" data-key="d">▶</button>
    <button class="dpad-down" data-key="s">▼</button>
  </div>
  <button class="btn-attack" data-key=" ">АТАКА</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const WALL = 26;

  const heartsEl = document.getElementById('hearts');
  const roomLabelEl = document.getElementById('roomLabel');
  const overlayEl = document.getElementById('overlay');
  const deathOverlayEl = document.getElementById('deathOverlay');
  const flashEl = document.getElementById('flash');
  const bossBarWrap = document.getElementById('bossBarWrap');
  const bossBar = document.getElementById('bossBar');
  const FINAL_CODE = 'FFWGTE';

  // --- Input state ---
  const keys = {};
  const CYRILLIC_MAP = { 'ц': 'w', 'ф': 'a', 'ы': 's', 'в': 'd' };

  function normalizeKey(raw) {
    const k = raw.toLowerCase();
    return CYRILLIC_MAP[k] || k;
  }

  window.addEventListener('keydown', (e) => {
    const k = normalizeKey(e.key);
    if (['w','a','s','d',' '].includes(k)) e.preventDefault();
    keys[k] = true;
  });
  window.addEventListener('keyup', (e) => {
    keys[normalizeKey(e.key)] = false;
  });

  document.querySelectorAll('.touch-controls button').forEach(btn => {
    const k = btn.dataset.key;
    const press = (e) => { e.preventDefault(); keys[k] = true; };
    const release = (e) => { e.preventDefault(); keys[k] = false; };
    btn.addEventListener('touchstart', press);
    btn.addEventListener('touchend', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  // --- Player ---
  const player = {
    x: WALL + 20, y: H / 2 - 10, w: 20, h: 20,
    speed: 2.1, facing: 'right',
    attacking: false, attackTimer: 0, attackDur: 18,
    invuln: 0, hearts: 3, maxHearts: 3,
    moving: false
  };

  function renderHearts() {
    heartsEl.innerHTML = '';
    for (let i = 0; i < player.maxHearts; i++) {
      const d = document.createElement('div');
      d.className = 'heart-icon' + (i < player.hearts ? '' : ' empty');
      heartsEl.appendChild(d);
    }
  }

  // --- Particles ---
  let particles = [];
  function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.8 + Math.random() * 2;
      particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 22 + Math.random() * 12, maxLife: 30, color
      });
    }
  }
  function updateParticles() {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  // ambient sparkles in treasury
  let sparkles = [];
  function updateSparkles(room) {
    if (room.name !== 'СОКРОВИЩНИЦА') return;
    if (Math.random() < 0.12) {
      sparkles.push({
        x: WALL + Math.random() * (W - WALL * 2),
        y: WALL + Math.random() * (H - WALL * 2),
        life: 40, maxLife: 40
      });
    }
    sparkles.forEach(s => s.life--);
    sparkles = sparkles.filter(s => s.life > 0);
  }
  function drawSparkles() {
    sparkles.forEach(s => {
      ctx.globalAlpha = Math.sin((s.life / s.maxLife) * Math.PI);
      ctx.fillStyle = '#E8C547';
      ctx.fillRect(s.x, s.y, 2, 2);
    });
    ctx.globalAlpha = 1;
  }

  function buildSpikeWalls() {
    const innerH = H - WALL * 2;
    const wallsCfg = [
      { x: 150, w: 24, segCount: 4, rotateMs: 900, phaseOffset: 0 },
      { x: 330, w: 24, segCount: 4, rotateMs: 650, phaseOffset: 2 }
    ];
    const segs = [];
    wallsCfg.forEach((cfg, wi) => {
      const segH = innerH / cfg.segCount;
      for (let i = 0; i < cfg.segCount; i++) {
        segs.push({
          x: cfg.x, y: WALL + i * segH, w: cfg.w, h: segH,
          wallIndex: wi, segIndex: i, segCount: cfg.segCount,
          rotateMs: cfg.rotateMs, phaseOffset: cfg.phaseOffset,
          prevSafe: true
        });
      }
    });
    return segs;
  }

  function segIsSafe(seg) {
    const safeIndex = (Math.floor(Date.now() / seg.rotateMs) + seg.phaseOffset) % seg.segCount;
    return seg.segIndex === safeIndex;
  }

  function resolveSolid(rect) {
    if (!rectsOverlap(player, rect)) return;
    const overlapX = Math.min(player.x + player.w - rect.x, rect.x + rect.w - player.x);
    const overlapY = Math.min(player.y + player.h - rect.y, rect.y + rect.h - player.y);
    if (overlapX < overlapY) {
      if (player.x < rect.x) player.x -= overlapX; else player.x += overlapX;
    } else {
      if (player.y < rect.y) player.y -= overlapY; else player.y += overlapY;
    }
  }

  function updateHazards(room) {
    room.hazards.forEach(seg => {
      const safeNow = segIsSafe(seg);
      if (!safeNow) {
        if (rectsOverlap(player, seg)) {
          if (seg.prevSafe) takeDamage(); // caught inside as it slams shut
          resolveSolid(seg);
        }
      }
      seg.prevSafe = safeNow;
    });
  }

  function drawHazards(room) {
    room.hazards.forEach(seg => {
      const safe = segIsSafe(seg);
      if (safe) {
        // open gap — soft golden guide light
        ctx.fillStyle = 'rgba(232,197,71,0.14)';
        ctx.fillRect(seg.x, seg.y, seg.w, seg.h);
        ctx.fillStyle = 'rgba(232,197,71,0.5)';
        ctx.fillRect(seg.x + seg.w / 2 - 1, seg.y + 2, 2, seg.h - 4);
      } else {
        ctx.fillStyle = '#3A2E2E';
        ctx.fillRect(seg.x, seg.y, seg.w, seg.h);
        ctx.fillStyle = '#8B2E2E';
        const spikeRows = Math.max(1, Math.round(seg.h / 12));
        for (let r = 0; r < spikeRows; r++) {
          const cy = seg.y + (r + 0.5) * (seg.h / spikeRows);
          ctx.fillRect(seg.x + 3, cy - 2, seg.w - 6, 4);
        }
        ctx.fillStyle = '#E9E6F2';
        for (let r = 0; r < spikeRows; r++) {
          const cy = seg.y + (r + 0.5) * (seg.h / spikeRows);
          ctx.fillRect(seg.x + seg.w / 2 - 1, cy - 3, 2, 2);
        }
      }
    });
  }

  // --- Heart pickups ---
  const HEART_PATTERN = [
    '0110110',
    '1111111',
    '1111111',
    '0111110',
    '0011100',
    '0001000'
  ];

  function drawPixelHeart(x, y, scale, color) {
    ctx.fillStyle = color;
    HEART_PATTERN.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        if (row[c] === '1') {
          ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
        }
      }
    });
  }

  function maybeDropHeart(room, x, y, chance) {
    if (Math.random() < chance) {
      room.pickups.push({ type: 'heart', x: x - 6, y: y - 6, w: 14, h: 12 });
    }
  }

  function updatePickups(room) {
    room.pickups.forEach(p => {
      if (p.collected) return;
      if (rectsOverlap(player, p)) {
        if (p.type === 'heart' && player.hearts < player.maxHearts) {
          player.hearts++;
          p.collected = true;
          renderHearts();
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#E8546B', 6);
        } else if (p.type === 'heart') {
          // already full — leave it for later, don't collect
        }
      }
    });
    room.pickups = room.pickups.filter(p => !p.collected);
  }

  function drawPickups(room) {
    room.pickups.forEach(p => {
      if (p.type === 'heart') {
        const bob = Math.sin(Date.now() / 260 + p.x) * 2;
        drawPixelHeart(p.x, p.y + bob, 2, '#E8546B');
      }
    });
  }

  // --- Enemy factories ---
  function makeSlime(x, y) {
    return {
      type: 'slime', x, y, w: 18, h: 16, hp: 1, hitCooldown: 0,
      vx: (Math.random() < 0.5 ? -1 : 1) * 0.6,
      vy: (Math.random() < 0.5 ? -1 : 1) * 0.6,
      alive: true
    };
  }

  function makeBoss(x, y) {
    return {
      type: 'boss', x, y, w: 40, h: 40, hp: 4, maxHp: 4, hitCooldown: 0,
      speed: 0.7, alive: true
    };
  }

  function makeBat(x, y) {
    return {
      type: 'bat', x, y, w: 14, h: 12, hp: 1, hitCooldown: 0,
      vx: 0, vy: 0, wanderTimer: 0, speed: 1.3, alive: true
    };
  }

  function makeSkeleton(x, y) {
    return {
      type: 'skeleton', x, y, w: 22, h: 24, hp: 2, hitCooldown: 0,
      speed: 0.45, alive: true
    };
  }

  function chaseMove(en, speed) {
    const cx = player.x + player.w / 2 - (en.x + en.w / 2);
    const cy = player.y + player.h / 2 - (en.y + en.h / 2);
    const d = Math.hypot(cx, cy) || 1;
    en.x += (cx / d) * speed;
    en.y += (cy / d) * speed;
    en.x = Math.max(WALL, Math.min(W - WALL - en.w, en.x));
    en.y = Math.max(WALL, Math.min(H - WALL - en.h, en.y));
  }

  // --- Rooms (factory so we can fully reset the dungeon on death) ---
  function buildRooms() {
    return [
      {
        name: 'ВХОД',
        enemies: [],
        pickups: [],
        hazards: [],
        hasChest: false,
        doorLeft: false,
        doorRightLocked: () => false,
        decor: 'entrance'
      },
      {
        name: 'ЗАЛ СТРАЖЕЙ',
        enemies: [makeSlime(180, 100), makeSlime(280, 220), makeSlime(220, 160)],
        pickups: [],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        decor: 'pillars'
      },
      {
        name: 'ТЁМНЫЙ КОРИДОР',
        enemies: [makeSlime(150, 90), makeSlime(320, 90), makeSlime(150, 250), makeSlime(320, 250)],
        pickups: [{ type: 'heart', x: W / 2 - 7, y: H / 2 - 6, w: 14, h: 12 }],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        decor: 'chains'
      },
      {
        name: 'ЛОГОВО НЕТОПЫРЕЙ',
        enemies: [makeBat(150, 100), makeBat(300, 100), makeBat(150, 240), makeBat(300, 240)],
        pickups: [],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        decor: 'bats'
      },
      {
        name: 'ЗАЛ КОСТЯНЫХ СТРАЖЕЙ',
        enemies: [makeSkeleton(160, 150), makeSkeleton(310, 190)],
        pickups: [{ type: 'heart', x: W / 2 - 7, y: H - WALL - 30, w: 14, h: 12 }],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        decor: 'bones'
      },
      {
        name: 'ЗАЛ ШИПОВ',
        enemies: [makeBat(240, 180)],
        pickups: [],
        hazards: buildSpikeWalls(),
        hasChest: false,
        doorLeft: true,
        doorRightLocked: () => false,
        decor: 'spikes'
      },
      {
        name: 'ПОСЛЕДНИЙ ОТРЯД',
        enemies: [makeSlime(140, 110), makeSlime(340, 250), makeBat(240, 90), makeSkeleton(240, 220)],
        pickups: [{ type: 'heart', x: WALL + 30, y: H - WALL - 30, w: 14, h: 12 }],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        decor: 'pillars'
      },
      {
        name: 'ЛОГОВО СТРАЖА',
        enemies: [makeBoss(W / 2 - 20, H / 2 - 20)],
        pickups: [],
        hazards: [],
        hasChest: false,
        doorLeft: true,
        doorRightLocked: function () { return this.enemies.some(en => en.alive); },
        isBossRoom: true,
        decor: 'boss'
      },
      {
        name: 'СОКРОВИЩНИЦА',
        enemies: [],
        pickups: [],
        hazards: [],
        hasChest: true,
        chestOpened: false,
        doorLeft: true,
        doorRightLocked: () => true,
        decor: 'treasury'
      }
    ];
  }

  let rooms = buildRooms();
  let currentRoom = 0;
  let gameWon = false;
  let deathActive = false;
  let shakeTimer = 0;

  function doorGapY() { return { from: H / 2 - 36, to: H / 2 + 36 }; }

  function resetPlayerToRoomStart(fromRight) {
    const gap = doorGapY();
    player.y = (gap.from + gap.to) / 2 - player.h / 2;
    player.x = fromRight ? W - WALL - player.w - 8 : WALL + 8;
  }

  function updateBossBar() {
    const room = rooms[currentRoom];
    if (room.isBossRoom) {
      const boss = room.enemies[0];
      if (boss && boss.alive) {
        bossBarWrap.classList.add('show');
        bossBar.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
      } else {
        bossBarWrap.classList.remove('show');
      }
    } else {
      bossBarWrap.classList.remove('show');
    }
  }

  function triggerDeath() {
    deathActive = true;
    particles = [];
    deathOverlayEl.classList.remove('hide');
    deathOverlayEl.classList.add('show');

    setTimeout(() => {
      // reset the whole dungeon from scratch
      rooms = buildRooms();
      currentRoom = 0;
      player.hearts = player.maxHearts;
      player.invuln = 0;
      resetPlayerToRoomStart(false);
      roomLabelEl.textContent = rooms[currentRoom].name;
      renderHearts();
      updateBossBar();

      deathOverlayEl.classList.remove('show');
      deathOverlayEl.classList.add('hide');
      setTimeout(() => {
        deathOverlayEl.classList.remove('hide');
        deathActive = false;
      }, 500);
    }, 1700);
  }

  function takeDamage() {
    if (player.invuln > 0 || gameWon || deathActive) return;
    player.hearts--;
    player.invuln = 70;
    shakeTimer = 10;
    flashEl.classList.remove('show');
    void flashEl.offsetWidth;
    flashEl.classList.add('show');
    if (player.hearts <= 0) {
      renderHearts();
      triggerDeath();
      return;
    }
    renderHearts();
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    if (gameWon || deathActive) { updateParticles(); return; }

    const room = rooms[currentRoom];

    // movement
    let dx = 0, dy = 0;
    if (keys['w']) { dy -= 1; player.facing = 'up'; }
    if (keys['s']) { dy += 1; player.facing = 'down'; }
    if (keys['a']) { dx -= 1; player.facing = 'left'; }
    if (keys['d']) { dx += 1; player.facing = 'right'; }

    player.moving = dx !== 0 || dy !== 0;

    if (player.moving) {
      const len = Math.hypot(dx, dy);
      player.x += (dx / len) * player.speed;
      player.y += (dy / len) * player.speed;
    }

    const gap = doorGapY();
    const inGapY = player.y + player.h / 2 > gap.from && player.y + player.h / 2 < gap.to;

    if (player.y < WALL) player.y = WALL;
    if (player.y + player.h > H - WALL) player.y = H - WALL - player.h;

    if (player.x < WALL) {
      if (room.doorLeft && inGapY) {
        currentRoom--;
        resetPlayerToRoomStart(true);
        roomLabelEl.textContent = rooms[currentRoom].name;
        updateBossBar();
        return;
      }
      player.x = WALL;
    }
    if (player.x + player.w > W - WALL) {
      const locked = room.doorRightLocked();
      if (!locked && inGapY && currentRoom < rooms.length - 1) {
        currentRoom++;
        resetPlayerToRoomStart(false);
        roomLabelEl.textContent = rooms[currentRoom].name;
        updateBossBar();
        return;
      }
      player.x = W - WALL - player.w;
    }

    // attack
    if (keys[' '] && player.attackTimer <= 0) {
      player.attacking = true;
      player.attackTimer = player.attackDur;
    }
    if (player.attackTimer > 0) {
      player.attackTimer--;
      if (player.attackTimer <= 0) player.attacking = false;
    }
    if (player.invuln > 0) player.invuln--;

    // enemies
    room.enemies.forEach(en => {
      if (!en.alive) return;

      if (en.hitCooldown > 0) en.hitCooldown--;

      if (en.type === 'slime') {
        en.x += en.vx;
        en.y += en.vy;
        if (en.x < WALL || en.x + en.w > W - WALL) en.vx *= -1;
        if (en.y < WALL || en.y + en.h > H - WALL) en.vy *= -1;
      } else if (en.type === 'bat') {
        en.wanderTimer--;
        if (en.wanderTimer <= 0) {
          const angle = Math.random() * Math.PI * 2;
          en.vx = Math.cos(angle) * en.speed;
          en.vy = Math.sin(angle) * en.speed;
          en.wanderTimer = 30 + Math.random() * 40;
        }
        en.x += en.vx;
        en.y += en.vy;
        if (en.x < WALL || en.x + en.w > W - WALL) en.vx *= -1;
        if (en.y < WALL || en.y + en.h > H - WALL) en.vy *= -1;
      } else if (en.type === 'skeleton') {
        chaseMove(en, en.speed);
      } else if (en.type === 'boss') {
        chaseMove(en, en.speed);
      }

      if (rectsOverlap(player, en)) {
        takeDamage();
      }

      if (player.attacking && en.hitCooldown <= 0) {
        const hb = attackHitbox();
        if (rectsOverlap(hb, en)) {
          en.hp--;
          en.hitCooldown = 20;
          if (en.hp <= 0) {
            en.alive = false;
            const color = en.type === 'boss' ? '#7A4FBE' : (en.type === 'skeleton' ? '#C7C2B8' : '#5FC26E');
            spawnParticles(en.x + en.w / 2, en.y + en.h / 2, color, en.type === 'boss' ? 16 : 8);
            const dropChance = en.type === 'boss' ? 1 : (en.type === 'skeleton' ? 0.4 : 0.15);
            maybeDropHeart(room, en.x + en.w / 2, en.y + en.h / 2, dropChance);
          }
          if (room.isBossRoom) updateBossBar();
        }
      }
    });

    // chest
    if (room.hasChest && !room.chestOpened) {
      const chest = { x: W / 2 - 16, y: H / 2 - 12, w: 32, h: 24 };
      if (rectsOverlap(player, chest)) {
        room.chestOpened = true;
        openChest();
      }
    }

    updateSparkles(room);
    updateHazards(room);
    updatePickups(room);
    updateParticles();
  }

  function attackHitbox() {
    const reach = 18;
    switch (player.facing) {
      case 'up': return { x: player.x - 2, y: player.y - reach, w: player.w + 4, h: reach };
      case 'down': return { x: player.x - 2, y: player.y + player.h, w: player.w + 4, h: reach };
      case 'left': return { x: player.x - reach, y: player.y - 2, w: reach, h: player.h + 4 };
      case 'right': return { x: player.x + player.w, y: player.y - 2, w: reach, h: player.h + 4 };
    }
  }

  function openChest() {
    gameWon = true;
    overlayEl.classList.add('show');
    document.getElementById('finalCode').textContent = FINAL_CODE;
    setTimeout(() => {
      document.getElementById('keyIcon').classList.add('pop');
    }, 150);
  }

  // --- Drawing ---
  function drawFloor(room) {
    const tile = 30;
    const treasury = room.decor === 'treasury';
    const boss = room.decor === 'boss';
    for (let y = WALL; y < H - WALL; y += tile) {
      for (let x = WALL; x < W - WALL; x += tile) {
        const alt = ((x / tile) + (y / tile)) % 2 === 0;
        if (treasury) {
          ctx.fillStyle = alt ? '#2E2A1C' : '#262214';
        } else if (boss) {
          ctx.fillStyle = alt ? '#241826' : '#1C121E';
        } else {
          ctx.fillStyle = alt ? '#221F38' : '#1C1930';
        }
        ctx.fillRect(x, y, tile, tile);
      }
    }
  }

  function drawRoomDecor(room) {
    if (room.decor === 'pillars') {
      ctx.fillStyle = '#171420';
      ctx.fillRect(WALL + 6, WALL + 4, 14, 24);
      ctx.fillRect(W - WALL - 20, WALL + 4, 14, 24);
      ctx.fillRect(WALL + 6, H - WALL - 28, 14, 24);
      ctx.fillRect(W - WALL - 20, H - WALL - 28, 14, 24);
    } else if (room.decor === 'chains') {
      ctx.fillStyle = '#3A3550';
      for (let x = WALL + 40; x < W - WALL - 20; x += 70) {
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(x, WALL + i * 8, 3, 5);
        }
      }
    } else if (room.decor === 'boss') {
      ctx.fillStyle = '#3A1620';
      ctx.fillRect(W / 2 - 30, WALL + 6, 60, 26);
      ctx.fillStyle = '#5A2230';
      ctx.fillRect(W / 2 - 24, WALL + 10, 48, 4);
    } else if (room.decor === 'bats') {
      ctx.fillStyle = '#241E38';
      for (let x = WALL + 30; x < W - WALL - 20; x += 60) {
        ctx.beginPath();
        ctx.arc(x, WALL + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (room.decor === 'bones') {
      ctx.fillStyle = 'rgba(199,194,184,0.25)';
      ctx.fillRect(WALL + 20, H - WALL - 16, 14, 3);
      ctx.fillRect(W - WALL - 40, WALL + 20, 3, 14);
      ctx.fillRect(WALL + 40, WALL + 16, 12, 3);
    } else if (room.decor === 'treasury') {
      ctx.fillStyle = 'rgba(232,197,71,0.05)';
      ctx.fillRect(WALL, WALL, W - WALL * 2, H - WALL * 2);
    }
  }

  function drawWalls(room) {
    ctx.fillStyle = '#1E1B2E';
    const gap = doorGapY();

    ctx.fillRect(0, 0, W, WALL);
    ctx.fillRect(0, H - WALL, W, WALL);

    if (room.doorLeft) {
      ctx.fillRect(0, 0, WALL, gap.from);
      ctx.fillRect(0, gap.to, WALL, H - gap.to);
    } else {
      ctx.fillRect(0, 0, WALL, H);
    }

    const locked = room.doorRightLocked();
    const hasForward = currentRoom < rooms.length - 1;
    if (hasForward && !locked) {
      ctx.fillRect(W - WALL, 0, WALL, gap.from);
      ctx.fillRect(W - WALL, gap.to, WALL, H - gap.to);
      ctx.fillStyle = '#F2A65A';
      ctx.fillRect(W - WALL, gap.from, 4, gap.to - gap.from);
    } else if (hasForward && locked) {
      ctx.fillRect(W - WALL, 0, WALL, H);
      ctx.fillStyle = '#5A3A2E';
      ctx.fillRect(W - WALL - 6, gap.from, 6, gap.to - gap.from);
      ctx.fillStyle = '#2A1C14';
      for (let by = gap.from + 6; by < gap.to; by += 10) {
        ctx.fillRect(W - WALL - 6, by, 6, 3);
      }
    } else {
      ctx.fillRect(W - WALL, 0, WALL, H);
    }

    const flicker = 0.6 + 0.4 * Math.sin(Date.now() / 180);
    ctx.fillStyle = `rgba(242,166,90,${flicker})`;
    ctx.beginPath();
    ctx.arc(WALL / 2, WALL / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W - WALL / 2, WALL / 2, 5, 0, Math.PI * 2);
    ctx.fill();

    // subtle brick texture on top/bottom walls
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    for (let bx = 0; bx < W; bx += 16) {
      ctx.beginPath();
      ctx.moveTo(bx, 2);
      ctx.lineTo(bx, WALL - 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx + 8, H - WALL + 2);
      ctx.lineTo(bx + 8, H - 2);
      ctx.stroke();
    }
  }

  function drawSword() {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;

    let baseAngle;
    switch (player.facing) {
      case 'up': baseAngle = -Math.PI / 2; break;
      case 'down': baseAngle = Math.PI / 2; break;
      case 'left': baseAngle = Math.PI; break;
      default: baseAngle = 0;
    }

    let swing;
    if (player.attacking) {
      const progress = 1 - player.attackTimer / player.attackDur;
      swing = (progress - 0.5) * 1.6;
    } else {
      swing = -0.5;
    }

    const angle = baseAngle + swing;
    const bladeLen = 20;
    const hiltLen = 6;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    ctx.fillStyle = '#6B5B3E';
    ctx.fillRect(hiltLen * -1, -2, hiltLen, 4);
    ctx.fillStyle = '#C9A63C';
    ctx.fillRect(0, -4, 3, 8);
    ctx.fillStyle = player.attacking ? '#F2F0FA' : '#CFCBE0';
    ctx.fillRect(3, -2, bladeLen, 4);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(3 + bladeLen - 3, -1, 3, 2);

    ctx.restore();
  }

  function drawPlayer() {
    const walkFrame = player.moving ? Math.floor(Date.now() / 160) % 2 : 0;
    const bob = player.moving && walkFrame === 1 ? -1 : 0;

    ctx.save();
    if (player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    ctx.translate(0, bob);

    // head
    ctx.fillStyle = '#E8C9A0';
    ctx.fillRect(player.x + 5, player.y, 10, 8);
    // eyes
    ctx.fillStyle = '#2B2013';
    ctx.fillRect(player.x + 7, player.y + 4, 2, 2);
    ctx.fillRect(player.x + 11, player.y + 4, 2, 2);
    // rounded cap (dome + brim band — deliberately not a pointed cap)
    ctx.fillStyle = '#2C7A44';
    ctx.beginPath();
    ctx.arc(player.x + 10, player.y + 1, 6, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(player.x + 4, player.y - 1, 12, 3);
    // tunic
    ctx.fillStyle = player.attacking ? '#5CC17E' : '#3F9E5C';
    ctx.fillRect(player.x, player.y + 7, player.w, player.h - 9);
    // belt
    ctx.fillStyle = '#6B4A2E';
    ctx.fillRect(player.x, player.y + player.h - 8, player.w, 3);

    // legs (walk cycle)
    ctx.fillStyle = '#2C7A44';
    if (walkFrame === 0) {
      ctx.fillRect(player.x + 2, player.y + player.h - 5, 4, 5);
      ctx.fillRect(player.x + player.w - 6, player.y + player.h - 5, 4, 5);
    } else {
      ctx.fillRect(player.x + 1, player.y + player.h - 5, 4, 6);
      ctx.fillRect(player.x + player.w - 5, player.y + player.h - 6, 4, 4);
    }

    ctx.restore();

    drawSword();
  }

  function drawEnemies(room) {
    room.enemies.forEach(en => {
      if (!en.alive) return;

      if (en.type === 'slime') {
        const wob = Math.sin(Date.now() / 200 + en.x) * 2;
        const hit = en.hitCooldown > 14;
        ctx.fillStyle = hit ? '#E9E6F2' : '#3D8F49';
        ctx.fillRect(en.x, en.y + 4 + wob, en.w, en.h - 4);
        ctx.fillStyle = hit ? '#F2F0FA' : '#5FC26E';
        ctx.fillRect(en.x + 2, en.y + wob, en.w - 4, en.h - 6);
      } else if (en.type === 'bat') {
        const flap = Math.sin(Date.now() / 90 + en.x) * 4;
        const hit = en.hitCooldown > 14;
        ctx.fillStyle = hit ? '#E9E6F2' : '#5A4E7A';
        ctx.fillRect(en.x - flap, en.y + 3, 6, 4);
        ctx.fillRect(en.x + en.w - 6 + flap, en.y + 3, 6, 4);
        ctx.fillStyle = hit ? '#F2F0FA' : '#3A3050';
        ctx.fillRect(en.x + 4, en.y, en.w - 8, en.h);
        ctx.fillStyle = '#E8546B';
        ctx.fillRect(en.x + 5, en.y + 2, 2, 2);
        ctx.fillRect(en.x + en.w - 7, en.y + 2, 2, 2);
      } else if (en.type === 'skeleton') {
        const hit = en.hitCooldown > 14;
        ctx.fillStyle = hit ? '#E9E6F2' : '#8B8578';
        ctx.fillRect(en.x + 4, en.y, en.w - 8, 8);
        ctx.fillStyle = hit ? '#F2F0FA' : '#C7C2B8';
        ctx.fillRect(en.x, en.y + 8, en.w, en.h - 8);
        ctx.fillStyle = '#1A1520';
        ctx.fillRect(en.x + 7, en.y + 3, 2, 2);
        ctx.fillRect(en.x + en.w - 9, en.y + 3, 2, 2);
        ctx.fillStyle = '#6B655C';
        for (let ry = en.y + 12; ry < en.y + en.h - 2; ry += 5) {
          ctx.fillRect(en.x + 3, ry, en.w - 6, 2);
        }
      } else if (en.type === 'boss') {
        const pulse = Math.sin(Date.now() / 260) * 2;
        const hit = en.hitCooldown > 14;
        ctx.fillStyle = hit ? '#E9E6F2' : '#4E2E7E';
        ctx.fillRect(en.x - pulse / 2, en.y - pulse / 2, en.w + pulse, en.h + pulse);
        ctx.fillStyle = hit ? '#F2F0FA' : '#7A4FBE';
        ctx.fillRect(en.x + 6, en.y + 6, en.w - 12, en.h - 12);
        ctx.fillStyle = '#E9E6F2';
        ctx.fillRect(en.x + 10, en.y + 14, 5, 5);
        ctx.fillRect(en.x + en.w - 15, en.y + 14, 5, 5);
        ctx.fillStyle = '#1A1520';
        ctx.fillRect(en.x + 11, en.y + 15, 2, 2);
        ctx.fillRect(en.x + en.w - 14, en.y + 15, 2, 2);
      }
    });
  }

  function drawChest(room) {
    if (!room.hasChest || room.chestOpened) return;
    const cx = W / 2 - 16, cy = H / 2 - 12;
    ctx.fillStyle = '#7A5230';
    ctx.fillRect(cx, cy, 32, 24);
    ctx.fillStyle = '#5A3A20';
    ctx.fillRect(cx, cy, 32, 8);
    ctx.fillStyle = '#E8C547';
    ctx.fillRect(cx + 14, cy + 8, 4, 10);
  }

  function drawPrincess(room) {
    if (room.decor !== 'treasury') return;
    const x = W / 2 + 62;
    const baseY = H / 2 - 40;
    const breathe = Math.sin(Date.now() / 900) * 1;
    const y = baseY + breathe;

    // dress (simple silhouette, not matching any specific iconic gown)
    ctx.fillStyle = '#4A5FA8';
    ctx.fillRect(x - 2, y + 20, 24, 24);
    ctx.fillStyle = '#5B70B8';
    ctx.fillRect(x, y + 12, 20, 10);

    // hair — golden, drawn as a wider layer behind the face so it actually shows
    ctx.fillStyle = '#E3C16F';
    ctx.fillRect(x, y, 20, 15);

    // face (centered, narrower than hair so a golden border remains visible)
    ctx.fillStyle = '#E8C9A0';
    ctx.fillRect(x + 4, y + 4, 12, 9);

    // eyes and mouth
    ctx.fillStyle = '#2B2013';
    ctx.fillRect(x + 6, y + 8, 2, 2);
    ctx.fillRect(x + 12, y + 8, 2, 2);
    ctx.fillStyle = '#B5695A';
    ctx.fillRect(x + 8, y + 11, 4, 1);

    // side strands falling past the face
    ctx.fillStyle = '#E3C16F';
    ctx.fillRect(x, y + 8, 4, 10);
    ctx.fillRect(x + 16, y + 8, 4, 10);

    // crown — generic pointed shape, not a specific iconic design
    ctx.fillStyle = '#C9A63C';
    ctx.fillRect(x + 4, y, 12, 2); // base band
    ctx.fillRect(x + 5, y - 2, 2, 2); // left point
    ctx.fillRect(x + 9, y - 3, 2, 3); // center point (tallest)
    ctx.fillRect(x + 13, y - 2, 2, 2); // right point
    ctx.fillStyle = '#8B5FBE';
    ctx.fillRect(x + 9, y, 2, 1); // small gem accent on the band
  }

  function drawVignette() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, H / 3, W / 2, H / 2, H / 1.1);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();

    if (shakeTimer > 0) {
      shakeTimer--;
      const mag = 2;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }

    const room = rooms[currentRoom];
    drawFloor(room);
    drawRoomDecor(room);
    drawHazards(room);
    drawChest(room);
    drawPrincess(room);
    drawPickups(room);
    drawEnemies(room);
    if (room.decor === 'treasury') drawSparkles();
    if (!deathActive) drawPlayer();
    drawParticles();
    drawWalls(room);
    drawVignette();

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  renderHearts();
  updateBossBar();
  loop();

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(FINAL_CODE);
      btn.textContent = 'Скопировано';
      setTimeout(() => { btn.textContent = 'Скопировать код'; }, 1500);
    } catch {
      btn.textContent = FINAL_CODE;
    }
  });
})();
</script>
